<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listen &amp; Record</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1f2328;--mute:#6b7280;--line:#e5e2d9;--accent:#2f5d8a;--rec:#c0392b;--ok:#2e7d4f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:20px;margin:6px 0 2px}
.sub{color:var(--mute);font-size:14px;margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.bar input[type=text]{flex:1 1 120px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:15px}
button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer}
button:hover{background:#f0eee7}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.rec{background:var(--rec);border-color:var(--rec);color:#fff}
button.small{padding:4px 8px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card.active{border-color:var(--accent);box-shadow:0 0 0 2px #2f5d8a22}
.head{display:flex;gap:8px;align-items:baseline}
.num{color:var(--mute);font-size:13px;min-width:22px}
.sp{font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;background:#e8eef5;color:var(--accent)}
.sp.b2{background:#f6e9e4;color:#a4472f}
.txt{font-size:18px;margin:6px 0 10px}
.txt.hidden{filter:blur(7px);user-select:none}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.st{font-size:13px;color:var(--mute);margin-top:6px;min-height:18px}
.st.err{color:var(--rec)}
.note{background:#fff8e1;border:1px solid #f0dfa0;border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:12px}
.teacher{background:#eef3f8;border:1px solid #cddbe9;border-radius:12px;padding:12px 14px;margin-bottom:14px}
.teacher h2{font-size:16px;margin:0 0 6px}
.teacher textarea{width:100%;min-height:90px;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px}
.tl{display:grid;grid-template-columns:28px 1fr;gap:6px 8px;align-items:center;margin-top:8px;font-size:14px}
.tl input[type=number]{width:78px;padding:4px 6px;border:1px solid var(--line);border-radius:6px}
.tapbtn{font-size:20px;padding:16px 24px;width:100%;margin:8px 0}
.hide{display:none!important}
label.sw{display:flex;gap:6px;align-items:center;font-size:14px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script type="application/json" id="cfg">{"title": "Listen & Record: Anyone But You (Margaret’s Return)", "subtitle": "문장을 듣고, 따라 읽으며 녹음한 뒤, 원본과 비교해 들어 보세요.", "lines": [{"sp": "Margaret", "text": "Want a coffee? It's the best in the world.", "start": 3.3, "end": 6.49}, {"sp": "Ben", "text": "You guys are really proud of your coffee here.", "start": 6.5, "end": 8.58}, {"sp": "Margaret", "text": "It's the best in the fucking world.", "start": 8.75, "end": 10.59}, {"sp": "Ben", "text": "Fuck. That is good.", "start": 17, "end": 18.96}, {"sp": "Margaret", "text": "I was thinking of going for a bit of a run later. Do you wanna join?", "start": 19.4, "end": 26.2}, {"sp": "Ben", "text": "I'm actually going on a bike ride with Bea, so I don't think I can.", "start": 26.3, "end": 29.72}, {"sp": "Margaret", "text": "She's a little sweet on you, hey?", "start": 29.73, "end": 31.19}, {"sp": "Ben", "text": "Oh, you caught that?", "start": 31.2, "end": 32.75}, {"sp": "Ben", "text": "How long have you and Beau been together?", "start": 34.35, "end": 36.4}, {"sp": "Margaret", "text": "Oh, we're just banging about.", "start": 36.6, "end": 37.85}, {"sp": "Margaret", "text": "He's nice, but I think I'm looking for someone less casual. More romantic.", "start": 38.1, "end": 43.85}, {"sp": "Margaret", "text": "Why did me and you ever break up, anyway?", "start": 45.5, "end": 48.16}, {"sp": "Ben", "text": "I don't really remember, but I think you said something like... I was an immature drongo smothered in Axe body spray.", "start": 48.17, "end": 57.03}, {"sp": "Margaret", "text": "Smells like you're not that guy anymore. Bea's a lucky girl.", "start": 59.41, "end": 66.02}]}</script>

<script>
// 페이지 원본(수정 전)을 저장해 두었다가, 교수자가 시간표를 저장할 때 사용
const SRC = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
let CFG = JSON.parse(document.getElementById('cfg').textContent);
let AUDIO_URI = document.getElementById('audiodata').textContent.trim();

const $ = (s, r=document) => r.querySelector(s);
const app = $('#app');
const audio = new Audio();
audio.preload = 'auto';
audio.src = AUDIO_URI;

let teacherOn = location.hash === '#teacher';
let hideText = false;
const recs = new Map();           // index -> {url, blob, ext}
let recorder = null, recStream = null, recIdx = -1, recTimer = null;
let playing = null;               // {idx, stopAt}
let tap = {on:false, i:0, phase:'start'};

function fmt(t){ return (t==null||isNaN(t)) ? '' : (+t).toFixed(2); }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function ready(l){ return l.start!=null && l.end!=null && l.end>l.start; }

/* ---------- 원본 구간 재생 ---------- */
function stopAudio(){
  audio.pause(); playing = null; audio.playbackRate = 1;
  document.querySelectorAll('.card.active').forEach(c=>c.classList.remove('active'));
}
function playSeg(i, rate=1, then){
  const l = CFG.lines[i]; if(!ready(l)) return;
  stopAudio(); stopMyPlayback();
  audio.currentTime = l.start; audio.playbackRate = rate;
  playing = {idx:i, stopAt:l.end, then};
  const c = $('#c'+i); if(c) c.classList.add('active');
  audio.play().catch(e=>setStatus(i,'재생할 수 없어요: '+e.message,true));
}
audio.addEventListener('timeupdate', ()=>{
  if(playing && audio.currentTime >= playing.stopAt){
    const th = playing.then; stopAudio(); if(th) th();
  }
  if(tap.on) updateTapInfo();
});
audio.addEventListener('ended', ()=>{ if(playing){const th=playing.then; stopAudio(); if(th) th();} });

/* ---------- 내 녹음 ---------- */
let myAudio = null;
function stopMyPlayback(){ if(myAudio){ myAudio.pause(); myAudio=null; } }
function playMine(i, then){
  const r = recs.get(i); if(!r) return;
  stopAudio(); stopMyPlayback();
  myAudio = new Audio(r.url);
  myAudio.onended = ()=>{ myAudio=null; if(then) then(); };
  myAudio.play().catch(e=>setStatus(i,'재생할 수 없어요: '+e.message,true));
}
function compare(i){
  if(!recs.has(i)) return;
  setStatus(i,'원본 → 내 녹음 순서로 재생합니다');
  playSeg(i,1,()=>playMine(i));
}
async function toggleRec(i){
  if(recorder && recIdx===i){ stopRec(); return; }
  if(recorder) stopRec();
  stopAudio(); stopMyPlayback();
  if(!navigator.mediaDevices || !window.MediaRecorder){
    setStatus(i,'이 브라우저에서는 녹음을 지원하지 않아요. 최신 Chrome 또는 Safari로 열어 주세요.',true); return;
  }
  try{
    recStream = await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(e){
    setStatus(i,'마이크를 사용할 수 없어요. 주소창의 마이크 권한을 허용했는지, 페이지가 작게 삽입된 화면이 아닌 전체 화면으로 열렸는지 확인해 주세요. ('+e.name+')',true); return;
  }
  const types = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'];
  const mime = types.find(t=>MediaRecorder.isTypeSupported(t)) || '';
  recorder = new MediaRecorder(recStream, mime?{mimeType:mime}:undefined);
  const chunks = [];
  recorder.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
  recorder.onstop = ()=>{
    const type = recorder.mimeType || mime || 'audio/webm';
    const blob = new Blob(chunks,{type});
    const ext = type.includes('mp4')?'m4a':type.includes('ogg')?'ogg':'webm';
    const old = recs.get(i); if(old) URL.revokeObjectURL(old.url);
    recs.set(i,{url:URL.createObjectURL(blob),blob,ext});
    recStream.getTracks().forEach(t=>t.stop());
    recorder=null; recIdx=-1; clearTimeout(recTimer);
    render(); setStatus(i,'녹음 완료. "내 녹음"이나 "비교"로 들어 보세요.');
  };
  recIdx = i; recorder.start();
  recTimer = setTimeout(()=>{ if(recorder) stopRec(); }, 60000);
  render(); setStatus(i,'● 녹음 중… 다 읽으면 "정지"를 누르세요.');
}
function stopRec(){ if(recorder && recorder.state!=='inactive') recorder.stop(); }

function download(i){
  const r = recs.get(i); if(!r) return;
  const id = ($('#sid')||{}).value||'', nm = ($('#snm')||{}).value||'';
  const base = [id,nm].filter(Boolean).join('_').replace(/[\\/:*?"<>|\s]+/g,'-') || 'recording';
  const a = document.createElement('a');
  a.href = r.url; a.download = `${base}_line${String(i+1).padStart(2,'0')}.${r.ext}`;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- 전체 저장 (zip) ---------- */
function crc32(buf){
  if(!crc32.t){ crc32.t=[]; for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; crc32.t[n]=c>>>0; } }
  let crc=0xFFFFFFFF; for(let i=0;i<buf.length;i++) crc = crc32.t[(crc^buf[i])&255]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}
function makeZip(files){
  const enc = new TextEncoder(), parts=[], central=[]; let offset=0;
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  for(const f of files){
    const name=enc.encode(f.name), crc=crc32(f.data), size=f.data.length;
    const lh = new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(size),...u32(size),...u16(name.length),...u16(0)]);
    parts.push(lh,name,f.data);
    central.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(size),...u32(size),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset)]),name);
    offset += lh.length+name.length+size;
  }
  let cdSize=0; central.forEach(c=>cdSize+=c.length);
  const end = new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(offset),...u16(0)]);
  return new Blob([...parts,...central,end],{type:'application/zip'});
}
async function zipAll(){
  if(!recs.size) return;
  const btn = $('#zipall'); btn.disabled = true; btn.textContent = '묶는 중…';
  try{
    const id = ($('#sid')||{}).value||'', nm = ($('#snm')||{}).value||'';
    const base = [id,nm].filter(Boolean).join('_').replace(/[\\/:*?"<>|\s]+/g,'-') || 'recordings';
    const files = [], enc = new TextEncoder();
    const order = [...recs.keys()].sort((a,b)=>a-b);
    for(const i of order){
      const r = recs.get(i), buf = new Uint8Array(await r.blob.arrayBuffer());
      files.push({name:`${base}_line${String(i+1).padStart(2,'0')}.${r.ext}`, data:buf});
    }
    const list = CFG.lines.map((l,i)=>`${String(i+1).padStart(2,'0')} ${l.sp?l.sp+': ':''}${l.text}${recs.has(i)?'':'   (녹음 없음)'}`).join('\n');
    files.push({name:`${base}_script.txt`, data:enc.encode(`${CFG.title}\n${id} ${nm}\n\n${list}\n`)});
    const blob = makeZip(files);
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${base}_recordings.zip`;
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ alert('묶는 중 오류가 났어요: '+e.message); }
  btn.disabled = false; btn.textContent = '전체 저장 (zip)';
}

function setStatus(i,msg,err){
  const e = $('#st'+i); if(!e) return; e.textContent = msg; e.className = 'st'+(err?' err':'');
}

/* ---------- 화면 ---------- */
function render(){
  tap.on = false;
  const keep = {id:($('#sid')||{}).value||'', nm:($('#snm')||{}).value||''};
  const spk = [...new Set(CFG.lines.map(l=>l.sp))];
  const anyUnset = CFG.lines.some(l=>!ready(l));
  let h = `<h1>${esc(CFG.title)}</h1><p class="sub">${esc(CFG.subtitle||'')}</p>`;
  if(anyUnset && !teacherOn) h += `<div class="note">일부 문장의 구간 시간이 아직 설정되지 않았어요. 교수자 설정에서 시간을 먼저 지정해 주세요.</div>`;
  h += `<div class="bar">
    <input type="text" id="sid" placeholder="학번" value="${esc(keep.id)}">
    <input type="text" id="snm" placeholder="이름" value="${esc(keep.nm)}">
    <label class="sw"><input type="checkbox" id="hid" ${hideText?'checked':''}> 대본 가리기 (먼저 듣기만)</label>
    <button id="zipall" class="primary small" ${recs.size?'':'disabled'}>전체 저장 (zip)</button>
    ${teacherOn?'<button id="tt" class="small">교수자 설정 닫기</button>':''}
  </div>`;
  if(teacherOn) h += teacherHtml();
  h += CFG.lines.map((l,i)=>{
    const isRec = recorder && recIdx===i, has = recs.has(i), ok = ready(l);
    return `<div class="card" id="c${i}">
      <div class="head"><span class="num">${i+1}</span><span class="sp ${spk.indexOf(l.sp)%2?'b2':''}">${esc(l.sp)}</span></div>
      <div class="txt ${hideText?'hidden':''}">${esc(l.text)}</div>
      <div class="row">
        <button data-a="play" data-i="${i}" ${ok?'':'disabled'}>▶ 듣기</button>
        <button data-a="slow" data-i="${i}" ${ok?'':'disabled'}>🐢 느리게</button>
        <button data-a="rec" data-i="${i}" class="${isRec?'rec':'primary'}" ${ok?'':'disabled'}>${isRec?'■ 정지':'● 녹음'}</button>
        <button data-a="mine" data-i="${i}" ${has?'':'disabled'}>▶ 내 녹음</button>
        <button data-a="cmp" data-i="${i}" ${has&&ok?'':'disabled'}>⇄ 비교</button>
        <button data-a="dl" data-i="${i}" class="small" ${has?'':'disabled'}>저장</button>
      </div>
      <div class="st" id="st${i}"></div>
    </div>`;
  }).join('');
  app.innerHTML = h;
  $('#hid').onchange = e=>{ hideText = e.target.checked; render(); };
  if($('#tt')) $('#tt').onclick = ()=>{ teacherOn=false; if(location.hash==='#teacher') history.replaceState(null,'',location.pathname+location.search); render(); };
  $('#zipall').onclick = zipAll;
  app.querySelectorAll('button[data-a]').forEach(b=>{
    b.onclick = ()=>{
      const i = +b.dataset.i, a = b.dataset.a;
      if(a==='play') playSeg(i,1);
      else if(a==='slow') playSeg(i,0.75);
      else if(a==='rec') toggleRec(i);
      else if(a==='mine') playMine(i);
      else if(a==='cmp') compare(i);
      else if(a==='dl') download(i);
    };
  });
  if(teacherOn) bindTeacher();
}

/* ---------- 교수자 설정 ---------- */
function teacherHtml(){
  const rows = CFG.lines.map((l,i)=>`
    <div class="mono">${i+1}</div>
    <div style="border-bottom:1px solid #cddbe9;padding-bottom:8px">
      <div class="row" style="margin-bottom:4px">
        <input type="text" data-f="sp" data-i="${i}" value="${esc(l.sp)}" style="width:84px;padding:4px 6px;border:1px solid var(--line);border-radius:6px" placeholder="이름">
        <input type="text" data-f="text" data-i="${i}" value="${esc(l.text)}" style="flex:1 1 220px;min-width:0;padding:4px 6px;border:1px solid var(--line);border-radius:6px">
        <button class="small" data-t="add" data-i="${i}" title="이 줄 아래에 새 줄 추가">＋줄</button>
        <button class="small" data-t="del" data-i="${i}" title="이 줄 삭제">삭제</button>
      </div>
      <div class="row">
        시작 <input type="number" step="0.05" min="0" data-f="start" data-i="${i}" value="${fmt(l.start)}">
        <button class="small" data-t="setstart" data-i="${i}">현재→</button>
        끝 <input type="number" step="0.05" min="0" data-f="end" data-i="${i}" value="${fmt(l.end)}">
        <button class="small" data-t="setend" data-i="${i}">현재→</button>
        <button class="small" data-t="prev" data-i="${i}">▶ 확인</button>
      </div>
    </div>`).join('');
  return `<div class="teacher" id="tp">
    <h2>교수자 설정: 문장별 구간 지정</h2>
    <div class="row" style="margin-bottom:6px">
      <button id="tplay" class="primary">▶ 전체 재생 / ⏸</button>
      <button id="tback">⏪ 2초</button>
      <select id="trate"><option value="1">1배속</option><option value="0.75">0.75배속</option><option value="0.5">0.5배속</option></select>
      <span class="mono" id="tnow">0.00s</span>
    </div>
    <div class="row" style="margin-bottom:4px">
      <button id="tapstart">탭 모드 시작 (처음부터)</button>
      <span style="font-size:13px;color:var(--mute)">들으면서 문장이 시작할 때와 끝날 때 아래 큰 버튼(또는 스페이스바)을 누르세요. 나중에 숫자로 미세 조정할 수 있어요.</span>
    </div>
    <div id="tapbox" class="hide">
      <div id="tapinfo" style="font-weight:600;margin-top:4px"></div>
      <button id="tapbtn" class="tapbtn primary">탭</button>
      <button id="tapundo" class="small">직전 탭 취소</button> <button id="tapstop" class="small">탭 모드 끝내기</button>
    </div>
    <div class="tl">${rows}</div>
    <div class="row" style="margin-top:10px">
      <button id="tcopy">시간표 복사</button>
      <button id="tsave" class="primary">학생용 HTML 저장</button>
    </div>
    <p style="font-size:13px;color:var(--mute);margin:6px 0 0">저장한 파일을 열면 이 시간표가 적용된 학생용 화면이 열립니다. 저장 파일 주소 끝에 #teacher를 붙이면 이 설정 화면이 다시 열려요.</p>
    <textarea id="tout" class="hide mono" readonly></textarea>
    <details style="margin-top:10px"><summary style="cursor:pointer;font-size:14px">다른 장면으로 바꾸기 (음성 파일 + 대본)</summary>
      <p style="font-size:13px;color:var(--mute)">제목, 음성 파일(mp3/m4a/mp4), 대본(한 줄에 한 문장, "이름: 문장" 형식)을 넣으면 새 장면이 만들어져요. 시간은 다시 지정해야 합니다.</p>
      <input type="text" id="ntitle" placeholder="제목 (예: Anyone But You – Hiking)" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px">
      <input type="file" id="nfile" accept="audio/*,video/mp4"><br>
      <textarea id="nscript" placeholder="Ben: All right, so is it like we just got together?&#10;Bea: What? No."></textarea>
      <button id="nmake" class="small" style="margin-top:6px">장면 만들기</button>
      <span id="nmsg" style="font-size:13px"></span>
    </details>
  </div>`;
}
function bindTeacher(){
  app.querySelectorAll('input[data-f]').forEach(inp=>{
    inp.onchange = ()=>{
      const f = inp.dataset.f, i = +inp.dataset.i;
      if(f==='text' || f==='sp'){ CFG.lines[i][f] = inp.value.trim(); render(); return; }
      CFG.lines[i][f] = inp.value===''?null:parseFloat(inp.value);
    };
  });
  app.querySelectorAll('button[data-t]').forEach(b=>{
    b.onclick = ()=>{
      const i=+b.dataset.i, t=b.dataset.t, l=CFG.lines[i];
      if(t==='add'){ CFG.lines.splice(i+1,0,{sp:l.sp,text:'',start:null,end:null}); recs.clear(); stopAudio(); render(); return; }
      if(t==='del'){ if(!confirm((i+1)+'번 문장을 삭제할까요?')) return; CFG.lines.splice(i,1); recs.clear(); stopAudio(); render(); return; }
      if(t==='setstart'){ l.start=+audio.currentTime.toFixed(2); }
      if(t==='setend'){ l.end=+audio.currentTime.toFixed(2); }
      if(t==='prev'){ if(!ready(l)){ alert('시작과 끝을 먼저 지정해 주세요.'); return; } playSeg(i,1); return; }
      syncInputs(); refreshReady();
    };
  });
  $('#tplay').onclick = ()=>{ stopMyPlayback(); playing=null; audio.paused?audio.play():audio.pause(); };
  $('#tback').onclick = ()=>{ audio.currentTime=Math.max(0,audio.currentTime-2); };
  $('#trate').onchange = e=>{ audio.playbackRate=+e.target.value; };
  $('#tapstart').onclick = ()=>{
    stopMyPlayback(); playing=null; tap={on:true,i:0,phase:'start',hist:[]};
    audio.currentTime=0; audio.playbackRate=+$('#trate').value; audio.play();
    $('#tapbox').classList.remove('hide'); updateTapInfo();
  };
  $('#tapbtn').onclick = doTap;
  $('#tapundo').onclick = undoTap;
  $('#tapstop').onclick = ()=>{ tap.on=false; $('#tapbox').classList.add('hide'); audio.pause(); };
  $('#tcopy').onclick = copyTimes;
  $('#tsave').onclick = saveStudent;
  $('#nmake').onclick = makeNew;
}
function refreshReady(){ /* 학생 화면 버튼 상태는 교수자 설정을 닫을 때 반영 */ }
function syncInputs(){
  app.querySelectorAll('input[data-f="start"],input[data-f="end"]').forEach(inp=>{ inp.value = fmt(CFG.lines[+inp.dataset.i][inp.dataset.f]); });
}
function updateTapInfo(){
  const n = $('#tnow'); if(n) n.textContent = audio.currentTime.toFixed(2)+'s';
  const ti = $('#tapinfo'); if(!ti||!tap.on) return;
  ti.textContent = tap.i>=CFG.lines.length ? '모든 문장을 표시했어요. 숫자를 확인하고 필요하면 고쳐 주세요.'
    : `다음: ${tap.i+1}번 문장 ${tap.phase==='start'?'시작':'끝'}  —  "${CFG.lines[tap.i].text.slice(0,40)}"`;
}
function doTap(){
  if(!tap.on || tap.i>=CFG.lines.length) return;
  const t = +audio.currentTime.toFixed(2), l = CFG.lines[tap.i];
  tap.hist.push({i:tap.i,phase:tap.phase,prev:tap.phase==='start'?l.start:l.end});
  if(tap.phase==='start'){ l.start=t; tap.phase='end'; }
  else { l.end=t; tap.phase='start'; tap.i++; }
  syncInputs(); updateTapInfo();
  if(tap.i>=CFG.lines.length){ audio.pause(); }
}
function undoTap(){
  const h = tap.hist && tap.hist.pop(); if(!h) return;
  const l = CFG.lines[h.i];
  if(h.phase==='start') l.start=h.prev; else l.end=h.prev;
  tap.i=h.i; tap.phase=h.phase; syncInputs(); updateTapInfo();
}
document.addEventListener('keydown', e=>{
  if(tap.on && e.code==='Space' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); doTap(); }
});
function timesJson(){ return JSON.stringify(CFG.lines.map((l,i)=>({n:i+1,start:l.start,end:l.end}))); }
function copyTimes(){
  const t = timesJson(), ta = $('#tout'); ta.classList.remove('hide'); ta.value = t; ta.select();
  if(navigator.clipboard) navigator.clipboard.writeText(t).catch(()=>{});
  try{ document.execCommand('copy'); }catch(e){}
}
function saveStudent(){
  const missing = CFG.lines.map((l,i)=>ready(l)?null:i+1).filter(Boolean);
  if(missing.length && !confirm('시간이 비어 있는 문장이 있어요: '+missing.join(', ')+'번. 그대로 저장할까요?')) return;
  const cfgText = JSON.stringify(CFG).replace(/</g,'\\u003c');
  let out = SRC.replace(/(<script type="application\/json" id="cfg">)[\s\S]*?(<\/script>)/, (m,a,b)=>a+cfgText+b);
  out = out.replace(/(<script type="text\/plain" id="audiodata">)[\s\S]*?(<\/script>)/, (m,a,b)=>a+AUDIO_URI+b);
  const blob = new Blob([out],{type:'text/html'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download = 'listen_record_student.html'; document.body.appendChild(a); a.click(); a.remove();
}
function makeNew(){
  const f = $('#nfile').files[0], raw = $('#nscript').value.trim(), msg = $('#nmsg');
  if(!f || !raw){ msg.textContent=' 음성 파일과 대본을 모두 넣어 주세요.'; return; }
  const lines = raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map(s=>{
    const m = s.match(/^([A-Za-z가-힣][\w .'-]{0,20}):\s*(.+)$/);
    return m ? {sp:m[1].trim(), text:m[2].trim(), start:null, end:null} : {sp:'', text:s, start:null, end:null};
  });
  const rd = new FileReader();
  rd.onload = ()=>{
    AUDIO_URI = rd.result; audio.src = AUDIO_URI;
    CFG = {title:$('#ntitle').value||'Listen & Record', subtitle:CFG.subtitle, lines};
    recs.clear(); render();
  };
  rd.readAsDataURL(f); msg.textContent=' 불러오는 중…';
}

window.addEventListener('hashchange', ()=>{ const t = location.hash==='#teacher'; if(t!==teacherOn){ teacherOn=t; render(); } });
render();
</script>
</body>
</html>
