<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listen &amp; Fill</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1f2328;--mute:#6b7280;--line:#e5e2d9;--accent:#2f5d8a;--ok:#2e7d4f;--bad:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6}
.wrap{max-width:780px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:20px;margin:6px 0 2px}
.sub{color:var(--mute);font-size:14px;margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.bar input[type=text]{flex:1 1 110px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:15px}
button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer}
button:hover{background:#f0eee7}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.small{padding:4px 8px;font-size:13px}
.score{background:#eef3f8;border:1px solid #cddbe9;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:600;position:sticky;top:6px;z-index:5}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card.active{border-color:var(--accent);box-shadow:0 0 0 2px #2f5d8a22}
.head{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.num{color:var(--mute);font-size:13px;font-weight:600;min-width:20px}
.sent{font-size:18px;line-height:2.1;margin:4px 0 6px}
.bg{display:inline-flex;flex-wrap:wrap;align-items:flex-end;gap:4px 4px;margin:0 2px;vertical-align:baseline;max-width:100%}
.badge{font-size:12px;font-weight:700;color:#fff;background:#d9480f;border-radius:99px;padding:2px 10px}
.card.hard{border-color:#e8a27c;box-shadow:0 0 0 2px #d9480f22}
.cnt{font-size:11px;color:var(--mute);margin-left:2px;white-space:nowrap}
input.bi{font:inherit;font-size:17px;padding:1px 4px;border:0;border-bottom:2px solid #9aa4b2;background:#f5f8fb;border-radius:4px 4px 0 0;text-align:center;min-width:0;max-width:100%}
input.bi:focus{outline:0;border-bottom-color:var(--accent);background:#eaf1f8}
input.bi.ok{border-bottom-color:var(--ok);background:#e6f4ea;color:#1b5e3a}
input.bi.bad{border-bottom-color:var(--bad);background:#fdeaea;color:#a02a1f}
input.bi.shown{border-bottom-color:#6b7280;background:#eee;color:#444;font-style:italic}
.ko{font-size:14px;color:var(--mute);margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.st{font-size:14px;margin-top:6px;min-height:20px}
.st.ok{color:var(--ok)} .st.bad{color:var(--bad)} .st.info{color:var(--mute)}
.note{background:#fff8e1;border:1px solid #f0dfa0;border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:12px}
.teacher{background:#eef3f8;border:1px solid #cddbe9;border-radius:12px;padding:12px 14px;margin-bottom:14px}
.teacher h2{font-size:16px;margin:0 0 6px}
.teacher textarea{width:100%;min-height:90px;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px}
.tl{display:grid;grid-template-columns:28px 1fr;gap:6px 8px;align-items:start;margin-top:8px;font-size:14px}
.tl input[type=number]{width:78px;padding:4px 6px;border:1px solid var(--line);border-radius:6px}
.tapbtn{font-size:20px;padding:16px 24px;width:100%;margin:8px 0}
.hide{display:none!important}
label.sw{display:flex;gap:6px;align-items:center;font-size:14px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.warn{color:var(--bad);font-size:12px}
#pv{position:fixed;inset:0;background:#fff;z-index:50;overflow:auto;padding:18px 16px 40px}
#pv .inner{max-width:760px;margin:0 auto}
#pv pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:14px;line-height:1.6;margin:0}
#pv .tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
#pv .hint{font-size:13px;color:var(--mute);margin-bottom:10px}
@media print{ .wrap{display:none!important} #pv{position:static;overflow:visible;padding:0} #pv .tools,#pv .hint{display:none!important} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script type="application/json" id="cfg">{"title": "Listen & Fill: Disney's Diverse Casting (Unit 7)", "subtitle": "문장을 듣고, 괄호 자리에 들어갈 말을 쓰세요. 칸 하나에 단어 하나예요.", "lines": [{"text": "I am against Disney's diverse casting because I want to see the characters I remember (from my childhood).", "ko": "저는 어린 시절 기억하는 캐릭터들을 그대로 보고 싶기 때문에 디즈니의 다양성 캐스팅에 반대합니다.", "start": 0.2, "end": 7.35}, {"text": "I am against Disney's diverse casting because live-action movies should (look similar to) the original animated films.", "ko": "저는 실사 영화는 원작 애니메이션과 비슷해야 한다고 생각하기 때문에 디즈니의 다양성 캐스팅에 반대합니다.", "start": 8.55, "end": 16.25}, {"text": "I oppose Disney's race-conscious recasting because it sometimes (feels like tokenism), with minority actors included just to show diversity.", "ko": "저는 디즈니가 기존 캐릭터의 인종을 바꾸는 캐스팅에 반대합니다. 때때로 소수집단 배우들을 단지 다양성을 보여주기 위해 캐스팅하는 보여주기식 다양성(tokenism)처럼 느껴지기 때문입니다.", "start": 17.22, "end": 26.4}, {"text": "I support Disney's diverse casting because it helps children (from different backgrounds) (feel included).", "ko": "저는 다양한 배경의 아이들이 자신도 포함되어 있다고 느끼도록 도와주기 때문에 디즈니의 다양성 캐스팅에 찬성합니다.", "start": 27.36, "end": 33.4}, {"text": "I am (in favor of) Disney's diverse casting because live-action movies do not have to be exactly (the same as) the original films.", "ko": "저는 실사 영화가 반드시 원작과 똑같을 필요는 없기 때문에 디즈니의 다양성 캐스팅에 찬성합니다.", "start": 34.65, "end": 43.05}, {"text": "Disney's diverse casting is (a positive change) because our society (is becoming more diverse), and movies should (reflect that change).", "ko": "저는 우리 사회가 점점 더 다양해지고 있으며 영화도 이러한 변화를 반영해야 하므로 디즈니의 다양성 캐스팅이 긍정적인 변화라고 생각합니다.", "start": 44.0, "end": 52.0}]}</script>

<script>
const SRC = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
let CFG = JSON.parse(document.getElementById('cfg').textContent);
let AUDIO_URI = document.getElementById('audiodata').textContent.trim();

const $ = (s, r=document) => r.querySelector(s);
const app = $('#app');
const audio = new Audio();
audio.preload = 'auto';
audio.src = AUDIO_URI;

let teacherOn = location.hash === '#teacher';
let showKo = true;
let ST = {};                      // 문장별 풀이 상태
let LOG = {};                     // 문장별 풀이 기록 (다시 풀어도 지워지지 않음)
let GLOG = {resetAll:0};
let MEMO = '';
function L(i){ return LOG[i] || (LOG[i] = {listens:0, slow:0, tries:[], reveal:null, resets:0}); }
let playing = null;
let tap = {on:false, i:0, phase:'start', hist:[]};

function fmt(t){ return (t==null||isNaN(t)) ? '' : (+t).toFixed(2); }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function ready(l){ return l.start!=null && l.end!=null && l.end>l.start; }
function norm(s){ return String(s||'').toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9']/g,''); }

/* ---------- 문장 분석: (괄호) 안이 빈칸 ---------- */
function parseLine(l){
  const t = l.text||'', parts=[], re=/\(([^)]*)\)/g; let last=0, m, n=0;
  while((m=re.exec(t))){
    if(m.index>last) parts.push({type:'t', s:t.slice(last,m.index)});
    const words = m[1].trim().split(/\s+/).filter(Boolean);
    if(words.length){ parts.push({type:'b', words}); n+=words.length; }
    last = re.lastIndex;
  }
  if(last<t.length) parts.push({type:'t', s:t.slice(last)});
  return {parts, total:n};
}
function answers(l){ const a=[]; parseLine(l).parts.forEach(p=>{ if(p.type==='b') a.push(...p.words); }); return a; }
function S(i){ return ST[i] || (ST[i] = {vals:[], res:[], checked:false, peeked:false}); }

/* ---------- 듣기 ---------- */
function stopAudio(){
  audio.pause(); playing=null; audio.playbackRate=1;
  document.querySelectorAll('.card.active').forEach(c=>c.classList.remove('active'));
  refreshPlayButtons();
}
function refreshPlayButtons(){
  document.querySelectorAll('.card button[data-a="play"],.card button[data-a="slow"]').forEach(b=>{
    const i=+b.dataset.i, slow=b.dataset.a==='slow';
    const mine = playing && playing.idx===i && playing.rate===(slow?0.75:1);
    b.textContent = mine ? (audio.paused ? (slow?'🐢 이어 듣기':'▶ 이어 듣기') : '⏸ 일시정지') : (slow?'🐢 느리게':'▶ 듣기');
  });
}
function playSeg(i, rate=1, track=false, force=false){
  const l = CFG.lines[i]; if(!ready(l)) return;
  if(!force && playing && playing.idx===i && playing.rate===rate){      // 같은 버튼: 일시정지 / 이어 듣기
    if(audio.paused) audio.play().catch(()=>{}); else audio.pause();
    refreshPlayButtons(); return;
  }
  if(track){ const g = L(i); if(rate===1) g.listens++; else g.slow++; }
  stopAudio();
  audio.currentTime = l.start; audio.playbackRate = rate;
  playing = {idx:i, stopAt:l.end, rate};
  const c = $('#c'+i); if(c) c.classList.add('active');
  audio.play().catch(()=>{});
  refreshPlayButtons();
}
audio.addEventListener('timeupdate', ()=>{
  if(playing && audio.currentTime >= playing.stopAt) stopAudio();
  if(tap.on) updateTapInfo();
});
audio.addEventListener('ended', ()=>{ if(playing) stopAudio(); });
audio.addEventListener('play', ()=>refreshPlayButtons());
audio.addEventListener('pause', ()=>refreshPlayButtons());

/* ---------- 채점 ---------- */
function checkLine(i){
  const l = CFG.lines[i], s = S(i), p = parseLine(l);
  if(!p.total || s.peeked) return;
  const ans = answers(l);
  s.res = ans.map((a,k)=> norm(s.vals[k])===norm(a));
  s.checked = true;
  L(i).tries.push({c:s.res.filter(Boolean).length, n:ans.length, w:ans.map((a,k)=> (s.vals[k]||'').trim() || '_')});
}
function revealLine(i){
  const s = S(i);
  if(s.checked && s.res.length && s.res.every(Boolean)) return false;   // 이미 전부 맞음
  s.peeked = true; const g = L(i); if(g.reveal===null) g.reveal = g.tries.length; return true;
}
function calc(){
  let tot=0, ok=0, full=0, lines=0, peek=0;
  CFG.lines.forEach((l,i)=>{
    const p = parseLine(l); if(!p.total) return;
    lines++; tot += p.total;
    const s = ST[i]; if(!s) return;
    if(s.peeked){ peek++; return; }
    if(s.checked){
      const c = s.res.filter(Boolean).length; ok += c;
      if(c===p.total) full++;
    }
  });
  return {tot, ok, full, lines, peek};
}
function scoreText(){
  const c = calc(), pct = c.tot ? Math.round(100*c.ok/c.tot) : 0;
  return `점수 ${c.ok} / ${c.tot}단어 (${pct}%)  ·  완전히 맞은 문장 ${c.full} / ${c.lines}` + (c.peek?`  ·  답을 본 문장 ${c.peek}개(점수 제외)`:'');
}
function updateScore(){ const e=$('#score'); if(e) e.textContent = scoreText(); }

function resultText(){
  const id = ($('#sid')||{}).value||'', nm = ($('#snm')||{}).value||'';
  const now = new Date(); const ts = now.toLocaleString('ko-KR');
  let totL=0, totS=0, totC=0, totP=0;
  CFG.lines.forEach((l,i)=>{ const g=LOG[i]; if(!g) return; totL+=g.listens; totS+=g.slow; totC+=g.tries.length; if(g.reveal!==null) totP++; });
  const out = [`${CFG.title}`, `학번: ${id}   이름: ${nm}`, `저장한 시각: ${ts}`, '',
    `[점수] ${scoreText()}`,
    `[전체 기록] 듣기 ${totL}회 / 느리게 듣기 ${totS}회 / 확인 ${totC}회 / 답 본 문장 ${totP}개` + (GLOG.resetAll?` / 전체 다시 풀기 ${GLOG.resetAll}회`:''),
    '', '[문장별 기록]'];
  CFG.lines.forEach((l,i)=>{
    const p = parseLine(l); if(!p.total) return;
    const s = ST[i] || {vals:[],res:[],checked:false,peeked:false}, g = LOG[i] || {listens:0,slow:0,tries:[],reveal:null,resets:0};
    const ans = answers(l);
    let mark;
    if(s.peeked) mark = `답 확인 (점수 제외) - ${g.reveal}회 시도 후 답 보기`;
    else if(g.reveal!==null && s.checked && s.res.every(Boolean)) mark = `O (이전에 답을 본 적 있음, ${g.reveal}회 시도 후)`;
    else if(!s.checked) mark = '미확인';
    else mark = s.res.every(Boolean) ? 'O 모두 맞음' : `X (${s.res.filter(x=>x===true).length}/${p.total})`;
    out.push(`${i+1}.${l.badge?' ['+l.badge+']':''} ${mark}`);
    out.push(`   듣기 ${g.listens}회, 느리게 듣기 ${g.slow}회 / 확인 ${g.tries.length}회` + (g.reveal===null?', 답 보기 안 함':`, 답 보기 함(${g.reveal}회 시도 후)`) + (g.resets?`, 다시 풀기 ${g.resets}회`:''));
    if(g.tries.length) out.push('   시도: ' + g.tries.map((t,k)=>`${k+1}회차 ${t.c}/${t.n} [${t.w.join(' ')}]`).join('  →  '));
    out.push(`   내 최종 답: ${s.peeked ? '(답 보기 사용)' : ans.map((a,k)=>(s.vals[k]||'').trim()||'(빈칸)').join(' / ')}`);
    out.push(`   정답: ${ans.join(' / ')}`);
  });
  const memo = (MEMO||'').trim();
  out.push('', '[질문이나 하고 싶은 말]', memo || '(없음)');
  return out.join('\n');
}
function saveResult(){
  const id = ($('#sid')||{}).value||'', nm = ($('#snm')||{}).value||'';
  const base = [id,nm].filter(Boolean).join('_').replace(/[\\/:*?"<>|\s]+/g,'-') || 'result';
  const blob = new Blob([resultText()],{type:'text/plain;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = base+'_result.txt';
  document.body.appendChild(a); a.click(); a.remove();
}
function openPdfView(){
  let pv = $('#pv'); if(pv) pv.remove();
  pv = document.createElement('div'); pv.id = 'pv';

    <pre>${esc(resultText())}</pre></div>`;

  pv.scrollTop = 0;
}
function copyResult(){

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>{ const b=$('#copyres'); if(b){ b.textContent='복사됨'; setTimeout(()=>{ if($('#copyres')) $('#copyres').textContent='결과 복사'; },1500); } }).catch(()=>alert('복사하지 못했어요. "결과 저장"을 이용해 주세요.'));
  } else alert('복사하지 못했어요. "결과 저장"을 이용해 주세요.');
}

/* ---------- 화면 ---------- */
function sentenceHtml(l,i){
  const p = parseLine(l), s = S(i); let k = 0, h = '';
  p.parts.forEach(pt=>{
    if(pt.type==='t'){ h += esc(pt.s); return; }
    h += '<span class="bg">';
    pt.words.forEach(w=>{
      const idx = k++;
      const val = s.peeked ? w : (s.vals[idx]||'');
      let cls = 'bi';
      if(s.peeked) cls += ' shown'; else if(s.checked && s.res[idx]===true) cls += ' ok'; else if(s.checked && s.res[idx]===false) cls += ' bad';
      const width = Math.max(4, norm(w).length+2);
      h += `<input class="${cls}" data-i="${i}" data-k="${idx}" value="${esc(val)}" ${s.peeked?'readonly':''} style="width:${width}ch" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="빈칸 ${idx+1}">`;
    });
    h += `</span>`;
  });
  return h;
}
function statusHtml(l,i){
  const s = S(i), p = parseLine(l);
  if(!p.total) return `<div class="st info">이 문장은 듣기만 해요.</div>`;
  if(s.peeked) return `<div class="st info">정답: ${esc(answers(l).join(' / '))}  (답을 본 문장은 점수에 포함되지 않아요)</div>`;
  if(s.checked){
    const c = s.res.filter(x=>x===true).length;
    return c===p.total ? `<div class="st ok">✔ 모두 맞았어요! (${c}/${p.total})</div>` : `<div class="st bad">${p.total}개 중 ${c}개 맞았어요. 빨간 칸을 고쳐서 다시 확인해 보세요.</div>`;
  }
  return `<div class="st info"></div>`;
}
function render(focusBad){
  tap.on = false;
  const keep = {id:($('#sid')||{}).value||'', nm:($('#snm')||{}).value||''};
  const anyUnset = CFG.lines.some(l=>!ready(l));

  h += `<div class="bar">

  </div>`;
  if(teacherOn) h += teacherHtml();

  h += CFG.lines.map((l,i)=>{
    const ok = ready(l), p = parseLine(l), s = S(i);
    return `<div class="card${l.badge?' hard':''}" id="c${i}">

      </div>

      ${p.total ? `<div class="row">

        <button data-a="reveal" data-i="${i}">답 보기</button>
        <button data-a="reset" data-i="${i}" class="small">다시 풀기</button>
      </div>`:''}
      ${statusHtml(l,i)}
    </div>`;
  }).join('');
  h += `<div class="card"><div style="font-weight:600;margin-bottom:4px">질문이나 하고 싶은 말 (선택)</div>
    <textarea id="memo" style="width:100%;min-height:70px;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:15px" placeholder="어려웠던 문장, 궁금한 점, 선생님께 하고 싶은 말을 남겨 주세요.">${esc(MEMO)}</textarea>
    <div style="font-size:12px;color:var(--mute);margin-top:4px">결과 저장·복사에는 점수와 함께 듣기·확인·답 보기 기록, 그리고 이 메모가 들어가요.</div></div>
  <div class="bar">

    <button id="resetall">전체 다시 풀기</button>
    <button id="savepdf">결과 PDF로 저장</button>
    <button id="saveres">결과 저장(txt)</button>
    <button id="copyres">결과 복사</button>
  </div>`;
  app.innerHTML = h;

  $('#kosw').onchange = e=>{ showKo = e.target.checked; render(); };
  if($('#tt')) $('#tt').onclick = ()=>{ teacherOn=false; if(location.hash==='#teacher') history.replaceState(null,'',location.pathname+location.search); render(); };
  $('#checkall').onclick = ()=>{ CFG.lines.forEach((l,i)=>{ const s=ST[i]; if(s && (s.checked || s.vals.some(v=>(v||'').trim()))) checkLine(i); }); render(); };
  $('#resetall').onclick = ()=>{ if(confirm('모든 문장을 처음부터 다시 풀까요? (풀이 기록은 남아요)')){ ST={}; GLOG.resetAll++; render(); } };
  $('#memo').oninput = e=>{ MEMO = e.target.value; };
  $('#saveres').onclick = saveResult;
  $('#savepdf').onclick = openPdfView;
  $('#copyres').onclick = copyResult;

  app.querySelectorAll('.card button[data-a]').forEach(b=>{
    b.onclick = ()=>{
      const i = +b.dataset.i, a = b.dataset.a;
      if(a==='play') playSeg(i,1,true);
      else if(a==='slow') playSeg(i,0.75,true);
      else if(a==='restart') playSeg(i,(playing&&playing.idx===i)?playing.rate:1,true,true);
      else if(a==='check'){ checkLine(i); render(); const bad = $(`#c${i} input.bi.bad`); if(bad) bad.focus(); }
      else if(a==='reveal'){
        if(!revealLine(i)){ const st=$(`#c${i} .st`); if(st) st.textContent='이미 모두 맞았어요!'; return; }
        render();
      }
      else if(a==='reset'){ L(i).resets++; delete ST[i]; render(); const f=$(`#c${i} input.bi`); if(f) f.focus(); }
    };
  });
  app.querySelectorAll('input.bi').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const i=+inp.dataset.i, k=+inp.dataset.k, s=S(i);
      s.vals[k] = inp.value;
      if(s.checked){ s.res[k] = undefined; inp.classList.remove('ok','bad'); updateScore(); }
    });
    inp.addEventListener('keydown', e=>{
      const i=+inp.dataset.i;
      if(e.key==='Enter'){ e.preventDefault(); checkLine(i); render(); const bad=$(`#c${i} input.bi.bad`); if(bad) bad.focus(); }
      else if(e.key===' '){
        e.preventDefault();
        const all=[...document.querySelectorAll(`#c${i} input.bi`)], at=all.indexOf(inp);
        if(all[at+1]) all[at+1].focus();
      }
    });
  });
  if(teacherOn) bindTeacher();
  refreshPlayButtons();
}

function bindTeacher(){
  app.querySelectorAll('.tl input[data-f]').forEach(inp=>{

      const f = inp.dataset.f, i = +inp.dataset.i;

      CFG.lines[i][f] = inp.value===''?null:parseFloat(inp.value);
    };
  });
  app.querySelectorAll('.tl button[data-t]').forEach(b=>{
    b.onclick = ()=>{
      const i=+b.dataset.i, t=b.dataset.t, l=CFG.lines[i];
      if(t==='add'){ CFG.lines.splice(i+1,0,{text:'',ko:'',start:null,end:null}); ST={}; LOG={}; stopAudio(); render(); return; }
      if(t==='del'){ if(!confirm((i+1)+'번 문장을 삭제할까요?')) return; CFG.lines.splice(i,1); ST={}; LOG={}; stopAudio(); render(); return; }
      if(t==='setstart'){ l.start=+audio.currentTime.toFixed(2); }
      if(t==='setend'){ l.end=+audio.currentTime.toFixed(2); }
      if(t==='prev'){ if(!ready(l)){ alert('시작과 끝을 먼저 지정해 주세요.'); return; } playSeg(i,1); return; }
      syncInputs();
    };
  });
  $('#tplay').onclick = ()=>{ playing=null; audio.paused?audio.play():audio.pause(); };
  $('#tback').onclick = ()=>{ audio.currentTime=Math.max(0,audio.currentTime-2); };
  $('#trate').onchange = e=>{ audio.playbackRate=+e.target.value; };
  $('#tapstart').onclick = ()=>{
    playing=null; tap={on:true,i:0,phase:'start',hist:[]};
    audio.currentTime=0; audio.playbackRate=+$('#trate').value; audio.play();
    $('#tapbox').classList.remove('hide'); updateTapInfo();
  };
  $('#tapbtn').onclick = doTap;
  $('#tapundo').onclick = undoTap;
  $('#tapstop').onclick = ()=>{ tap.on=false; $('#tapbox').classList.add('hide'); audio.pause(); };
  $('#tcopy').onclick = copyTimes;
  $('#tsave').onclick = saveStudent;
  $('#nmake').onclick = makeNew;
}
function syncInputs(){
  app.querySelectorAll('.tl input[data-f="start"],.tl input[data-f="end"]').forEach(inp=>{ inp.value = fmt(CFG.lines[+inp.dataset.i][inp.dataset.f]); });
}
function updateTapInfo(){
  const n = $('#tnow'); if(n) n.textContent = audio.currentTime.toFixed(2)+'s';
  const ti = $('#tapinfo'); if(!ti||!tap.on) return;
  ti.textContent = tap.i>=CFG.lines.length ? '모든 문장을 표시했어요. 숫자를 확인하고 필요하면 고쳐 주세요.'
    : `다음: ${tap.i+1}번 문장 ${tap.phase==='start'?'시작':'끝'}  —  "${CFG.lines[tap.i].text.replace(/[()]/g,'').slice(0,40)}"`;
}
function doTap(){
  if(!tap.on || tap.i>=CFG.lines.length) return;
  const t = +audio.currentTime.toFixed(2), l = CFG.lines[tap.i];
  tap.hist.push({i:tap.i,phase:tap.phase,prev:tap.phase==='start'?l.start:l.end});
  if(tap.phase==='start'){ l.start=t; tap.phase='end'; } else { l.end=t; tap.phase='start'; tap.i++; }
  syncInputs(); updateTapInfo();
  if(tap.i>=CFG.lines.length) audio.pause();
}
function undoTap(){
  const h = tap.hist && tap.hist.pop(); if(!h) return;
  const l = CFG.lines[h.i];
  if(h.phase==='start') l.start=h.prev; else l.end=h.prev;
  tap.i=h.i; tap.phase=h.phase; syncInputs(); updateTapInfo();
}
document.addEventListener('keydown', e=>{
  if(tap.on && e.code==='Space' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); doTap(); }
});
function copyTimes(){
  const t = JSON.stringify(CFG.lines.map((l,i)=>({n:i+1,start:l.start,end:l.end}))), ta = $('#tout');
  ta.classList.remove('hide'); ta.value = t; ta.select();
  if(navigator.clipboard) navigator.clipboard.writeText(t).catch(()=>{});
  try{ document.execCommand('copy'); }catch(e){}
}
function saveStudent(){
  const missing = CFG.lines.map((l,i)=>ready(l)?null:i+1).filter(Boolean);
  if(missing.length && !confirm('시간이 비어 있는 문장이 있어요: '+missing.join(', ')+'번. 그대로 저장할까요?')) return;
  const cfgText = JSON.stringify(CFG).replace(/</g,'\\u003c');
  let out = SRC.replace(/(<script type="application\/json" id="cfg">)[\s\S]*?(<\/script>)/, (m,a,b)=>a+cfgText+b);
  out = out.replace(/(<script type="text\/plain" id="audiodata">)[\s\S]*?(<\/script>)/, (m,a,b)=>a+AUDIO_URI+b);
  const blob = new Blob([out],{type:'text/html'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download = 'listen_fill_student.html'; document.body.appendChild(a); a.click(); a.remove();
}
function makeNew(){
  const f = $('#nfile').files[0], raw = $('#nscript').value.trim(), msg = $('#nmsg');
  if(!f || !raw){ msg.textContent=' 음성 파일과 문장을 모두 넣어 주세요.'; return; }
  const lines = raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map(s=>{
    const k = s.indexOf('|');
    return k<0 ? {text:s, ko:'', start:null, end:null} : {text:s.slice(0,k).trim(), ko:s.slice(k+1).trim(), start:null, end:null};
  });
  const rd = new FileReader();
  rd.onload = ()=>{
    AUDIO_URI = rd.result; audio.src = AUDIO_URI;
    CFG = {title:$('#ntitle').value||'Listen & Fill', subtitle:CFG.subtitle, lines};
    ST={}; LOG={}; render();
  };
  rd.readAsDataURL(f); msg.textContent=' 불러오는 중…';
}

window.addEventListener('hashchange', ()=>{ const t = location.hash==='#teacher'; if(t!==teacherOn){ teacherOn=t; render(); } });
render();
</script>
